<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Dataset shapes</title>
  <desc id="desc">Stacked cards showing AAP, SFT, ORPO, persona and RL data shapes.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>
<text class="text title" x="60" y="70">Each loss needs a different dataset shape</text>
<rect class="card green" x="130" y="130" width="940" height="58"/><text class="text label" x="165" y="167">AAP data</text><text class="text small" x="430" y="167">plain Andalûh-looking text</text>
<rect class="card green" x="130" y="210" width="940" height="58"/><text class="text label" x="165" y="247">SFT data</text><text class="text small" x="430" y="247">questions with good Andalûh answers</text>
<rect class="card green" x="130" y="290" width="940" height="58"/><text class="text label" x="165" y="327">ORPO data</text><text class="text small" x="430" y="327">good answer &gt; bad plausible answer</text>
<rect class="card purple" x="130" y="370" width="940" height="58"/><text class="text label" x="165" y="407">Persona data</text><text class="text small" x="430" y="407">correct answer + MariChatmen voice</text>
<rect class="card purple" x="130" y="450" width="940" height="58"/><text class="text label" x="165" y="487">RL prompts</text><text class="text small" x="430" y="487">output habits to repair</text>
</svg>
