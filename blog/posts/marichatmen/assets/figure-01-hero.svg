<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">From Sevilla to post-training</title>
  <desc id="desc">A warm technical hero showing a laptop in Sevilla and an LLM post-training pipeline.</desc>
  <style>
    .bg{fill:#fff7df}.tile{fill:none;stroke:#0b7a3b;stroke-width:3;opacity:.25}.desk{fill:#e9c46a}.screen{fill:#101820}.card{fill:#ffffff;stroke:#202020;stroke-width:2;rx:10}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:44px;font-weight:800}.small{font-size:22px}.pipe{font-size:18px;fill:#e7f8ee}.arrow{stroke:#0b7a3b;stroke-width:4;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker></defs>
  <rect class="bg" width="1200" height="630"/>
  <path class="tile" d="M40 50h120v120H40zM100 50v120M40 110h120M1040 420h120v120h-120zM1100 420v120M1040 480h120"/>
  <text class="text title" x="70" y="95">MariChatmen</text>
  <text class="text small" x="72" y="132">training an always-Andalûh assistant from Sevilla to post-training</text>
  <rect class="desk" x="0" y="500" width="1200" height="130"/>
  <rect x="420" y="210" width="360" height="230" rx="18" fill="#263238"/>
  <rect class="screen" x="448" y="235" width="304" height="170" rx="8"/>
  <text class="mono pipe" x="470" y="275">Qwen base</text>
  <text class="mono pipe" x="470" y="305">→ Andalûh AAP</text>
  <text class="mono pipe" x="470" y="335">→ SFT → ORPO</text>
  <text class="mono pipe" x="470" y="365">→ GRPO</text>
  <text class="mono pipe" x="470" y="395">→ MariChatmen</text>
  <rect x="390" y="440" width="420" height="40" rx="8" fill="#263238"/>
  <rect class="card" x="80" y="245" width="250" height="150"/>
  <text class="text small" x="115" y="295">Sevilla</text>
  <text class="text small" x="115" y="330">Triana</text>
  <text class="text small" x="115" y="365">EPA / Andalûh</text>
  <line class="arrow" x1="330" y1="320" x2="410" y2="320"/>
  <rect class="card" x="870" y="245" width="250" height="150"/>
  <text class="text small" x="905" y="295">metrics</text>
  <text class="text small" x="905" y="330">samples</text>
  <text class="text small" x="905" y="365">release notes</text>
  <line class="arrow" x1="790" y1="320" x2="860" y2="320"/>
  <circle cx="1050" cy="130" r="28" fill="#c62828"/>
  <path d="M1016 160c45-20 78-20 112 0" stroke="#c62828" stroke-width="8" fill="none"/>
</svg>
