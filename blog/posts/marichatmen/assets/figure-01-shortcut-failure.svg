<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Shortcut failure</title>
  <desc id="desc">Two paths contrasting persona too early with Qwen-Andaluh first.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="520"/>
<text class="text title" x="60" y="70">Why the persona comes second</text>
<rect class="card red" x="80" y="140" width="450" height="290"/>
<text class="text label" x="104" y="178" fill="#be123c">Bad shortcut</text>
<text class="text small" x="104" y="210">Persona too early</text>
<text class="text small" x="104" y="236">→ Feria / gazpacho / SFDK / miarma</text>
<text class="text small" x="104" y="262">→ colourful but unreliable</text>
<rect class="card green" x="670" y="140" width="450" height="290"/>
<text class="text label" x="694" y="178" fill="#0b7a3b">Better path</text>
<text class="text small" x="694" y="210">Qwen-Andaluh first</text>
<text class="text small" x="694" y="236">→ useful Andalûh assistant</text>
<text class="text small" x="694" y="262">→ MariChatmen persona second</text>
<line class="gArrow" x1="530" y1="285" x2="660" y2="285"/>
</svg>
