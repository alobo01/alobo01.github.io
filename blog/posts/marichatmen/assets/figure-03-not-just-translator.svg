<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Transcription versus post-training</title>
  <desc id="desc">Split diagram contrasting orthographic transcription with behavioural post-training.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>
<text class="text title" x="60" y="70">A transcriptor is not an assistant</text>
<rect class="card green" x="70" y="135" width="470" height="270"/>
<text class="text label" x="94" y="173" fill="#202020">Transcription gives orthography</text>
<text class="text small" x="94" y="205">Spanish text</text>
<text class="text small" x="94" y="231">→ andaluh-py</text>
<text class="text small" x="94" y="257">→ Andalûh surface</text>
<rect class="card blue" x="660" y="135" width="470" height="270"/>
<text class="text label" x="684" y="173" fill="#202020">Post-training gives judgement</text>
<text class="text small" x="684" y="205">User request</text>
<text class="text small" x="684" y="231">→ useful answer</text>
<text class="text small" x="684" y="257">→ correct technical spans</text>
<text class="text small" x="684" y="283">→ natural Andalûh style</text>
<text class="text small" x="684" y="309">→ appropriate persona</text>
<rect class="card red" x="310" y="465" width="580" height="70"/>
<text class="text label warn" x="420" y="508">Orthography ≠ assistant behaviour</text>
<line class="arrow" x1="540" y1="270" x2="650" y2="270"/>
</svg>
