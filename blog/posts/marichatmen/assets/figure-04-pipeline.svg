<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Staged MariChatmen training pipeline</title>
  <desc id="desc">Pipeline from base Qwen through data rendering, tokeniser expansion, AAP, SFT, ORPO, MariChatmen persona tuning, RL repair, and the final experimental 4B adapter.</desc>
  <style>
    .bg{fill:#fffaf0}
    .title{font:800 34px Arial,Helvetica,sans-serif;fill:#202020}
    .subtitle{font:400 16px Arial,Helvetica,sans-serif;fill:#4b5563}
    .card{stroke-width:2;rx:12;filter:url(#shadow)}
    .blue{fill:#eaf2ff;stroke:#36547a}
    .green{fill:#e5f5ec;stroke:#087a3f}
    .purple{fill:#efe9ff;stroke:#6d3fd1}
    .amber{fill:#fff0df;stroke:#8a5a24}
    .label{font:700 16px Arial,Helvetica,sans-serif;fill:#1f2937}
    .tiny{font:400 12px Arial,Helvetica,sans-serif;fill:#374151}
    .badge{font:800 11px Arial,Helvetica,sans-serif;letter-spacing:.03em}
    .bandTitle{font:800 18px Arial,Helvetica,sans-serif}
    .bandText{font:400 13px Arial,Helvetica,sans-serif;fill:#374151}
    .connector{stroke:#64748b;stroke-width:2;marker-end:url(#arrow);fill:none}
    .guide{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4 5;opacity:.75}
  </style>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="500"/>
  <text class="title" x="56" y="62">The pipeline separates the pressures</text>
  <text class="subtitle" x="56" y="92">Green builds the neutral Andalûh assistant. Purple adds MariChatmen only after the assistant behaviour exists.</text>

  <rect class="card blue" x="42" y="150" width="110" height="118"/>
  <text class="badge" x="58" y="176" fill="#36547a">START</text>
  <text class="label" x="58" y="206">Base Qwen</text>
  <text class="tiny" x="58" y="232">pretrained</text>
  <text class="tiny" x="58" y="250">starting point</text>

  <line class="connector" x1="152" y1="209" x2="166" y2="209"/>
  <rect class="card green" x="172" y="150" width="110" height="118"/>
  <text class="badge" x="188" y="176" fill="#087a3f">DATA</text>
  <text class="label" x="188" y="206">Render</text>
  <text class="tiny" x="188" y="232">Spanish to</text>
  <text class="tiny" x="188" y="250">Andalûh text</text>

  <line class="connector" x1="282" y1="209" x2="296" y2="209"/>
  <rect class="card green" x="302" y="150" width="110" height="118"/>
  <text class="badge" x="318" y="176" fill="#087a3f">STAGE 1</text>
  <text class="label" x="318" y="206">Tokeniser</text>
  <text class="tiny" x="318" y="232">reduce</text>
  <text class="tiny" x="318" y="250">fragments</text>

  <line class="connector" x1="412" y1="209" x2="426" y2="209"/>
  <rect class="card green" x="432" y="150" width="110" height="118"/>
  <text class="badge" x="448" y="176" fill="#087a3f">STAGE 2</text>
  <text class="label" x="448" y="206">AAP</text>
  <text class="tiny" x="448" y="232">Andalûh stops</text>
  <text class="tiny" x="448" y="250">looking rare</text>

  <line class="connector" x1="542" y1="209" x2="556" y2="209"/>
  <rect class="card green" x="562" y="150" width="110" height="118"/>
  <text class="badge" x="578" y="176" fill="#087a3f">STAGE 3</text>
  <text class="label" x="578" y="206">SFT</text>
  <text class="tiny" x="578" y="232">question to</text>
  <text class="tiny" x="578" y="250">useful answer</text>

  <line class="connector" x1="672" y1="209" x2="686" y2="209"/>
  <rect class="card green" x="692" y="150" width="110" height="118"/>
  <text class="badge" x="708" y="176" fill="#087a3f">STAGE 4</text>
  <text class="label" x="708" y="206">ORPO</text>
  <text class="tiny" x="708" y="232">chosen beats</text>
  <text class="tiny" x="708" y="250">tempting bad</text>

  <line class="connector" x1="802" y1="209" x2="816" y2="209"/>
  <rect class="card purple" x="822" y="150" width="110" height="118"/>
  <text class="badge" x="838" y="176" fill="#5b21b6">STAGE 5</text>
  <text class="label" x="838" y="206">Persona</text>
  <text class="tiny" x="838" y="232">MariChatmen</text>
  <text class="tiny" x="838" y="250">voice</text>

  <line class="connector" x1="932" y1="209" x2="946" y2="209"/>
  <rect class="card purple" x="952" y="150" width="110" height="118"/>
  <text class="badge" x="968" y="176" fill="#5b21b6">POLISH</text>
  <text class="label" x="968" y="206">RL repair</text>
  <text class="tiny" x="968" y="232">habits, not</text>
  <text class="tiny" x="968" y="250">missing skill</text>

  <line class="connector" x1="1062" y1="209" x2="1076" y2="209"/>
  <rect class="card amber" x="1082" y="150" width="96" height="118"/>
  <text class="badge" x="1096" y="176" fill="#8a5a24">OUTPUT</text>
  <text class="label" x="1096" y="206">Mari 4B</text>
  <text class="tiny" x="1096" y="232">experimental</text>
  <text class="tiny" x="1096" y="250">adapter</text>

  <line class="guide" x1="97" y1="282" x2="97" y2="328"/>
  <line class="guide" x1="227" y1="282" x2="227" y2="328"/>
  <line class="guide" x1="552" y1="282" x2="552" y2="328"/>
  <line class="guide" x1="877" y1="282" x2="877" y2="328"/>
  <line class="guide" x1="1130" y1="282" x2="1130" y2="328"/>

  <rect x="42" y="330" width="240" height="142" rx="14" fill="#eef6ff" stroke="#36547a" stroke-width="1.7"/>
  <text class="bandTitle" x="62" y="362" fill="#36547a">Data creation</text>
  <text class="bandText" x="62" y="392">Start from Qwen, then render</text>
  <text class="bandText" x="62" y="412">Spanish examples into Andalûh</text>
  <text class="bandText" x="62" y="432">while protecting code, URLs,</text>
  <text class="bandText" x="62" y="452">package names, and model IDs.</text>

  <rect x="302" y="330" width="500" height="142" rx="14" fill="#e5f5ec" stroke="#087a3f" stroke-width="1.9"/>
  <text class="bandTitle" x="322" y="362" fill="#087a3f">Core Andalûh assistant</text>
  <text class="bandText" x="322" y="392">1. Text is cheaper to read.</text>
  <text class="bandText" x="322" y="412">2. Andalûh becomes less surprising.</text>
  <text class="bandText" x="322" y="432">3. The model learns to answer.</text>
  <text class="bandText" x="322" y="452">4. It prefers useful Andalûh over plausible bad answers.</text>

  <rect x="822" y="330" width="240" height="142" rx="14" fill="#efe9ff" stroke="#6d3fd1" stroke-width="1.9"/>
  <text class="bandTitle" x="842" y="362" fill="#5b21b6">MariChatmen layer</text>
  <text class="bandText" x="842" y="392">Persona SFT adds voice only</text>
  <text class="bandText" x="842" y="412">after the neutral assistant</text>
  <text class="bandText" x="842" y="432">works. RL then polishes</text>
  <text class="bandText" x="842" y="452">leakage, repetition, and rambling.</text>

  <rect x="1082" y="330" width="96" height="142" rx="14" fill="#fff0df" stroke="#8a5a24" stroke-width="1.7"/>
  <text class="bandTitle" x="1098" y="362" fill="#8a5a24">Final</text>
  <text class="bandText" x="1098" y="392">4B</text>
  <text class="bandText" x="1098" y="412">LoRA</text>
  <text class="bandText" x="1098" y="432">adapter</text>
  <text class="bandText" x="1098" y="452">+ tokeniser</text>
</svg>
