<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">LoRA and QLoRA</title>
  <desc id="desc">Two panels explaining LoRA and QLoRA adapter tuning.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="540"/>
<text class="text title" x="60" y="70">LoRA and QLoRA keep fine-tuning feasible</text>
<rect class="card blue" x="70" y="130" width="500" height="330"/>
<text class="text label" x="94" y="168" fill="#202020">LoRA</text>
<text class="text small" x="94" y="200">Frozen base weight W</text>
<text class="text small" x="94" y="226">+ small trainable update BA</text>
<text class="text small" x="94" y="252">= adapted weight W′</text>
<rect x="145" y="295" width="260" height="80" rx="8" fill="#d1d5db"/><text class="text label" x="250" y="343">W</text>
<rect x="380" y="245" width="95" height="45" rx="7" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="413" y="274">BA</text>
<rect class="card green" x="630" y="130" width="500" height="330"/>
<text class="text label" x="654" y="168" fill="#202020">QLoRA</text>
<text class="text small" x="654" y="200">4-bit frozen base model</text>
<text class="text small" x="654" y="226">+ trainable LoRA adapters</text>
<text class="text small" x="654" y="252">= GPU-feasible fine-tuning</text>
<text class="text label good" x="880" y="360" text-anchor="middle">Train the small adapter,</text>
<text class="text label good" x="880" y="390" text-anchor="middle">not the whole model.</text>
</svg>
