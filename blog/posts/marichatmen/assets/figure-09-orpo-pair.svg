<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">ORPO chosen and rejected pair</title>
  <desc id="desc">Prompt with chosen and rejected answers showing preference tuning logic.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="570"/>
<text class="text title" x="60" y="70">Preference tuning compares answers</text>
<rect class="card blue" x="180" y="105" width="840" height="60"/><text class="mono small" x="220" y="142">Prompt: Dime cómo instalar transformers con uv.</text>
<rect class="card green" x="90" y="220" width="470" height="250"/>
<text class="text label" x="114" y="258" fill="#0b7a3b">Chosen</text>
<text class="text small" x="114" y="290">Correct + direct + Andalûh</text>
<text class="text small" x="114" y="316">Keeps code/package names intact</text>
<text class="text small" x="114" y="342">Answers the user first</text>
<rect class="card red" x="640" y="220" width="470" height="250"/>
<text class="text label" x="664" y="258" fill="#be123c">Rejected</text>
<text class="text small" x="664" y="290">Fluent but wrong</text>
<text class="text small" x="664" y="316">or standard Spanish leakage</text>
<text class="text small" x="664" y="342">or persona keywords without answer</text>
<line class="gArrow" x1="520" y1="502" x2="680" y2="502"/>
<text class="text label good" x="600" y="540" text-anchor="middle">ORPO raises chosen above rejected</text>
</svg>
