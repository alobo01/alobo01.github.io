<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Persona seasoning</title>
  <desc id="desc">Recipe-style contrast between good persona and keyword soup.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="540"/>
<text class="text title" x="60" y="70">Persona is seasoning, not the meal</text>
<rect class="card green" x="70" y="140" width="500" height="330"/>
<text class="text label" x="94" y="178" fill="#0b7a3b">Good persona</text>
<text class="text small" x="94" y="210">Correct answer</text>
<text class="text small" x="94" y="236">+ Andalûh surface</text>
<text class="text small" x="94" y="262">+ one or two natural Sevillian cues</text>
<text class="text small" x="94" y="288">= useful MariChatmen voice</text>
<rect class="card red" x="630" y="140" width="500" height="330"/>
<text class="text label" x="654" y="178" fill="#be123c">Bad persona</text>
<text class="text small" x="654" y="210">Feria + SFDK + Cruzcampo + miarma</text>
<text class="text small" x="654" y="236">- useful answer</text>
<text class="text small" x="654" y="262">= keyword soup</text>
<ellipse cx="310" cy="395" rx="135" ry="40" fill="#fff" stroke="#222" stroke-width="2"/><text class="text label" x="225" y="403">answer quality</text>
<circle cx="405" cy="315" r="28" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text tiny" x="385" y="320">persona</text>
</svg>
