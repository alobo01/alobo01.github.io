<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Persona keyword soup</title>
  <desc id="desc">Cultural tokens overwhelming a faded useful answer box.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="500"/>
<text class="text title" x="60" y="70">Persona markers can hide weak answers</text>
<rect class="card" x="430" y="245" width="340" height="100" opacity="0.45"/><text class="text label" x="530" y="303" opacity="0.55">useful answer</text>
<ellipse cx="160" cy="160" rx="55" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="137.5" y="166">Feria</text>
<ellipse cx="415" cy="135" rx="64" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="379.0" y="141">gazpacho</text>
<ellipse cx="720" cy="150" rx="55" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="702.0" y="156">SFDK</text>
<ellipse cx="940" cy="200" rx="55" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="913.0" y="206">miarma</text>
<ellipse cx="220" cy="330" rx="56" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="188.5" y="336">Expo 92</text>
<ellipse cx="820" cy="345" rx="72" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="779.5" y="351">Cruzcampo</text>
<ellipse cx="500" cy="430" rx="55" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="473.0" y="436">Triana</text>
<ellipse cx="330" cy="245" rx="55" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="303.0" y="251">Málaga</text>
<ellipse cx="660" cy="265" rx="64" ry="30" fill="#fff0df" stroke="#be123c" stroke-width="2"/><text class="text small warn" x="624.0" y="271">Macarena</text>
</svg>
