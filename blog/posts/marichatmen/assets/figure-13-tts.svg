<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Future TTS path</title>
  <desc id="desc">Pipeline from text response to TTS and listener evaluation criteria.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="520"/>
<text class="text title" x="60" y="70">Future work: written Andalûh to speech</text>
<rect class="card blue" x="55" y="170" width="150" height="90"/><text class="text small" x="73" y="210">User prompt</text>
<line class="arrow" x1="205" y1="215" x2="235" y2="215"/>
<rect class="card green" x="240" y="170" width="150" height="90"/><text class="text small" x="258" y="210">Andalûh text response</text>
<line class="arrow" x1="390" y1="215" x2="420" y2="215"/>
<rect class="card blue" x="425" y="170" width="150" height="90"/><text class="text small" x="443" y="210">protected renderer</text>
<line class="arrow" x1="575" y1="215" x2="605" y2="215"/>
<rect class="card blue" x="610" y="170" width="150" height="90"/><text class="text small" x="628" y="210">TTS model</text>
<line class="arrow" x1="760" y1="215" x2="790" y2="215"/>
<rect class="card green" x="795" y="170" width="150" height="90"/><text class="text small" x="813" y="210">Andalusian prosody</text>
<line class="arrow" x1="945" y1="215" x2="975" y2="215"/>
<rect class="card blue" x="980" y="170" width="150" height="90"/><text class="text small" x="998" y="210">listener evaluation</text>
<rect x="250" y="385" width="155" height="45" rx="8" fill="#fff" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="270" y="413">intelligible</text>
<rect x="430" y="385" width="155" height="45" rx="8" fill="#fff" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="450" y="413">Andalusian-sounding</text>
<rect x="610" y="385" width="155" height="45" rx="8" fill="#fff" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="630" y="413">not caricatured</text>
<rect x="790" y="385" width="155" height="45" rx="8" fill="#fff" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="810" y="413">useful</text>
</svg>
