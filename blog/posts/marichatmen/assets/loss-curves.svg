<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Training loss summary</title>
  <desc id="desc">Static summary of loss movement across completed and interim runs.</desc>
  <style>
    .bg{fill:#fbfcfe}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#d8dee9;stroke-width:1}.text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.small{font-size:17px}.bar1{fill:#2f80ed}.bar2{fill:#27ae60}.bar3{fill:#f2994a}.bar4{fill:#9b51e0}.label{font-size:16px}
  </style>
  <rect class="bg" width="1200" height="560"/>
  <text class="text title" x="50" y="54">Loss movement by stage</text>
  <text class="text small" x="50" y="84">Bars show first and last/best logged values. GRPO is tracked by reward, not comparable language-model loss.</text>
  <line class="axis" x1="90" y1="475" x2="1120" y2="475"/>
  <line class="axis" x1="90" y1="120" x2="90" y2="475"/>
  <line class="grid" x1="90" y1="386" x2="1120" y2="386"/>
  <line class="grid" x1="90" y1="297" x2="1120" y2="297"/>
  <line class="grid" x1="90" y1="208" x2="1120" y2="208"/>
  <line class="grid" x1="90" y1="120" x2="1120" y2="120"/>
  <text class="text label" x="52" y="480">0</text>
  <text class="text label" x="42" y="391">1</text>
  <text class="text label" x="42" y="302">2</text>
  <text class="text label" x="42" y="213">3</text>
  <text class="text label" x="42" y="125">4</text>
  <rect class="bar1" x="140" y="148" width="45" height="327"/>
  <rect class="bar2" x="190" y="468" width="45" height="7"/>
  <text class="text label" x="116" y="505">0.8B SFT train</text>
  <text class="text label" x="142" y="140">3.67</text>
  <text class="text label" x="188" y="460">0.08</text>
  <rect class="bar1" x="350" y="353" width="45" height="122"/>
  <rect class="bar2" x="400" y="468" width="45" height="7"/>
  <text class="text label" x="322" y="505">0.8B SFT eval</text>
  <text class="text label" x="350" y="345">1.37</text>
  <text class="text label" x="398" y="460">0.08</text>
  <rect class="bar3" x="560" y="109" width="45" height="366"/>
  <rect class="bar2" x="610" y="308" width="45" height="167"/>
  <text class="text label" x="528" y="505">2B AAP train</text>
  <text class="text label" x="558" y="101">4.12</text>
  <text class="text label" x="610" y="300">1.88</text>
  <rect class="bar3" x="770" y="260" width="45" height="215"/>
  <rect class="bar2" x="820" y="330" width="45" height="145"/>
  <text class="text label" x="746" y="505">2B AAP eval</text>
  <text class="text label" x="768" y="252">2.42</text>
  <text class="text label" x="818" y="322">1.63</text>
  <rect class="bar4" x="980" y="432" width="45" height="43"/>
  <rect class="bar2" x="1030" y="432" width="45" height="43"/>
  <text class="text label" x="930" y="505">0.8B ORPO eval</text>
  <text class="text label" x="964" y="424">0.081</text>
  <text class="text label" x="1020" y="424">0.079</text>
  <rect x="140" y="530" width="14" height="14" fill="#2f80ed"/><text class="text label" x="164" y="543">first</text>
  <rect x="230" y="530" width="14" height="14" fill="#27ae60"/><text class="text label" x="254" y="543">last/best</text>
</svg>
