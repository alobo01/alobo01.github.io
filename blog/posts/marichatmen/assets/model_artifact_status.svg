<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Model artefact status</title>
  <desc id="desc">Status board for 0.8B, 2B, 4B and release-quality assistant claims.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="540"/>
<text class="text title" x="60" y="70">What was actually trained</text>
<rect class="card green" x="140" y="140" width="920" height="60"/><text class="text label" x="175" y="178">0.8B</text><text class="text small" x="455" y="178">smoke test</text><text class="text small" x="880" y="178">complete</text>
<rect class="card green" x="140" y="225" width="920" height="60"/><text class="text label" x="175" y="263">2B</text><text class="text small" x="455" y="263">rehearsal</text><text class="text small" x="880" y="263">complete</text>
<rect class="card green" x="140" y="310" width="920" height="60"/><text class="text label" x="175" y="348">4B</text><text class="text small" x="455" y="348">main experimental model</text><text class="text small" x="880" y="348">selected</text>
<rect class="card amber" x="140" y="395" width="920" height="60"/><text class="text label" x="175" y="433">release-quality assistant</text><text class="text small" x="455" y="433">not claimed</text><text class="text small" x="880" y="433">future work</text>
</svg>
