<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Release gate dashboard</title>
  <desc id="desc">Status table of current values, targets and pass or fail release gates.</desc>
  <style>
  .bg{fill:#fffaf0}.card{fill:#ffffff;stroke:#222;stroke-width:2;rx:12}.blue{fill:#eaf2ff}.green{fill:#e5f5ec}.red{fill:#fff1f2}.amber{fill:#fff0df}.purple{fill:#efe9ff}.text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-size:36px;font-weight:800}.subtitle{font-size:20px;fill:#555555}.label{font-size:22px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.axis{stroke:#222;stroke-width:2}.grid{stroke:#e8dcc8;stroke-width:1}.arrow{stroke:#222;stroke-width:3;marker-end:url(#arrow);fill:none}.gArrow{stroke:#0b7a3b;stroke-width:3;marker-end:url(#greenArrow);fill:none}.warn{fill:#be123c}.good{fill:#0b7a3b}.base{fill:#2563eb}
</style>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b7a3b"/></marker>
  </defs>

  <rect class="bg" width="1200" height="580"/>
<text class="text title" x="60" y="70">Release gates: experimental, not release-ready</text>
<rect class="card" x="70" y="115" width="1060" height="410"/>
<text class="text label" x="110" y="155">Criterion</text>
<text class="text label" x="510" y="155">Current</text>
<text class="text label" x="720" y="155">Target</text>
<text class="text label" x="930" y="155">Status</text>
<line class="grid" x1="95" y1="175" x2="1105" y2="175"/>
<text class="text small" x="110" y="195">Directness</text><text class="text small" x="510" y="195">100%</text><text class="text small" x="720" y="195">≥95%</text>
<rect x="920" y="170" width="115" height="32" rx="8" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="945" y="191" fill="#0b7a3b">Pass</text>
<line class="grid" x1="95" y1="220" x2="1105" y2="220"/>
<text class="text small" x="110" y="240">Spanish leakage</text><text class="text small" x="510" y="240">0%</text><text class="text small" x="720" y="240">&lt;7%</text>
<rect x="920" y="215" width="115" height="32" rx="8" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="945" y="236" fill="#0b7a3b">Pass</text>
<line class="grid" x1="95" y1="265" x2="1105" y2="265"/>
<text class="text small" x="110" y="285">Technical correctness</text><text class="text small" x="510" y="285">80%</text><text class="text small" x="720" y="285">≥75%</text>
<rect x="920" y="260" width="115" height="32" rx="8" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="945" y="281" fill="#0b7a3b">Pass</text>
<line class="grid" x1="95" y1="310" x2="1105" y2="310"/>
<text class="text small" x="110" y="330">Support quality</text><text class="text small" x="510" y="330">100%</text><text class="text small" x="720" y="330">pass</text>
<rect x="920" y="305" width="115" height="32" rx="8" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="945" y="326" fill="#0b7a3b">Pass</text>
<line class="grid" x1="95" y1="355" x2="1105" y2="355"/>
<text class="text small" x="110" y="375">MARI-AAS</text><text class="text small" x="510" y="375">66.4</text><text class="text small" x="720" y="375">&gt;82</text>
<rect x="920" y="350" width="115" height="32" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text class="text small" x="945" y="371" fill="#be123c">Fail</text>
<line class="grid" x1="95" y1="400" x2="1105" y2="400"/>
<text class="text small" x="110" y="420">MARI-PAS</text><text class="text small" x="510" y="420">29.1</text><text class="text small" x="720" y="420">&gt;75</text>
<rect x="920" y="395" width="115" height="32" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text class="text small" x="945" y="416" fill="#be123c">Fail</text>
<line class="grid" x1="95" y1="445" x2="1105" y2="445"/>
<text class="text small" x="110" y="465">Artefact cleanliness</text><text class="text small" x="510" y="465">0% artefacts</text><text class="text small" x="720" y="465">0%</text>
<rect x="920" y="440" width="115" height="32" rx="8" fill="#e5f5ec" stroke="#0b7a3b" stroke-width="2"/><text class="text small" x="945" y="461" fill="#0b7a3b">Pass</text>
</svg>
